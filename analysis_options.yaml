include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - "**/build/**"
    - "**/*.g.dart"

linter:
  rules:
    - prefer_final_locals
    - prefer_final_fields
    - avoid_print
    - always_declare_return_types
    - unawaited_futures
    - prefer_const_constructors
    - directives_ordering
