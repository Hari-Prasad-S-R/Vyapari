name: vyapari_app
description: Vyapari — Indian property trading board game (Android, iOS, web).
publish_to: 'none'
version: 0.2.2+4
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  bonsoir: ^7.1.6
  clock: ^1.1.3
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  just_audio: ^0.10.6
  mobile_scanner: ^7.5.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  record: ^7.1.2
  shared_preferences: ^2.5.6
  vyapari_core:
    path: ../core
  vyapari_protocol:
    path: ../protocol
  vyapari_server:
    path: ../server
  wakelock_plus: ^1.8.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/boards/india/

# App icons and splash, generated from assets/branding (the Rooftop V logo):
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  min_sdk_android: 24
  adaptive_icon_background: "#0B6E5F"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#0B6E5F"
    theme_color: "#0B6E5F"

flutter_native_splash:
  color: "#0B6E5F"
  image: assets/branding/splash.png
  android_12:
    color: "#0B6E5F"
    image: assets/branding/splash.png
  web: true
