name: vyapari_app
description: Vyapari — Indian property trading board game (Android, iOS, web).
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  clock: ^1.1.3
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  just_audio: ^0.10.6
  mobile_scanner: ^7.5.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  record: ^7.1.2
  shared_preferences: ^2.5.6
  vyapari_core:
    path: ../core
  vyapari_protocol:
    path: ../protocol
  vyapari_server:
    path: ../server
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/boards/india/
