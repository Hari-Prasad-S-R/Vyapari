name: vyapari_server
description: Vyapari game server — rooms, sessions, WebSocket hub, voice relay, discovery.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  shelf: ^1.4.1
  shelf_web_socket: ">=2.0.0 <4.0.0"
  sqlite3: ^2.4.0
  web_socket_channel: ">=2.4.0 <4.0.0"
  vyapari_core:
    path: ../core
  vyapari_protocol:
    path: ../protocol
  shelf_static: ^1.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
