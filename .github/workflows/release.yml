name: Release

# Push a tag like v0.1.0 to build the signed APK, the iOS build and the web
# client. Signing secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (Android) and an App Store Connect
# API key for TestFlight (iOS).
on:
  push:
    tags: ["v*"]

jobs:
  android-web:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9 # keep in step with local dev; bump deliberately
      - run: flutter pub get
      - name: keystore
        # `if` cannot read secrets or the step's own env; HAS_KEYSTORE is
        # set at job level. Without it the APK is signed with the debug key.
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > packages/app/android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > packages/app/android/key.properties
      - name: no keystore
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 not set - release APK is signed with the debug key"
      - name: build
        run: |
          cd packages/app
          VERSION=${GITHUB_REF_NAME#v}
          flutter build apk --release --build-name "$VERSION"
          flutter build web --release --build-name "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: vyapari-${{ github.ref_name }}-android-web
          path: |
            packages/app/build/app/outputs/flutter-apk/app-release.apk
            packages/app/build/web

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9 # keep in step with local dev; bump deliberately
      - run: flutter pub get
      - name: build (unsigned IPA; upload to TestFlight with your API key)
        run: |
          cd packages/app
          flutter build ipa --release --no-codesign --build-name "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: vyapari-${{ github.ref_name }}-ios
          path: packages/app/build/ios/archive

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t vyapari-server:${{ github.ref_name }} .
      - run: docker image ls vyapari-server
